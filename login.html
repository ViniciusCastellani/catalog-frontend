<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="auth-mark">catalog / editor</p>
      <h1>Entrar</h1>
      <p class="auth-sub">Acesse seus catálogos.</p>

      <div id="msg"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Entrar</button>
      </form>

      <p class="auth-footer">
        Não tem conta? <a href="register.html">Criar conta</a><br />
        <a href="forgot-password.html">Esqueci minha senha</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
