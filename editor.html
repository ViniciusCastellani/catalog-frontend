<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="brand">&larr; catalog<span>/</span>editor</a>
    <nav class="app-nav">
      <span id="catalogue-title-display"></span>
      <button id="logout-btn">Sair</button>
    </nav>
  </header>

  <div class="editor-shell">
    <aside class="editor-panel">
      <h4>Página</h4>
      <div class="field">
        <label for="catalogue-title">Título do catálogo</label>
        <input type="text" id="catalogue-title" />
      </div>
      <div class="field">
        <label for="page-format">Formato da folha</label>
        <select id="page-format">
          <option value="A4">A4</option>
          <option value="A3">A3</option>
          <option value="A5">A5</option>
          <option value="LETTER">Carta (Letter)</option>
          <option value="LEGAL">Ofício (Legal)</option>
          <option value="CUSTOM">Personalizado</option>
        </select>
      </div>
      <div class="field">
        <label>Orientação</label>
        <div class="orientation-toggle">
          <button type="button" class="orientation-btn" data-orientation="portrait">Retrato</button>
          <button type="button" class="orientation-btn" data-orientation="landscape">Paisagem</button>
        </div>
      </div>
      <div class="field-inline" id="custom-size-fields" hidden>
        <div>
          <label for="page-width">Largura (pt)</label>
          <input type="number" id="page-width" min="1" />
        </div>
        <div>
          <label for="page-height">Altura (pt)</label>
          <input type="number" id="page-height" min="1" />
        </div>
      </div>
      <div class="field">
        <label for="page-bg-color">Cor de fundo</label>
        <input type="color" id="page-bg-color" />
      </div>
      <div class="field">
        <label for="page-bg-image-file">Imagem de fundo</label>
        <input type="file" id="page-bg-image-file" accept="image/*" />
        <div id="page-bg-preview"></div>
      </div>
      <button id="save-page-btn" class="btn-primary btn-block">Salvar página</button>

      <h4>Exportar catálogo</h4>
      <button id="export-png-btn" class="btn-secondary btn-block">Exportar como imagem (PNG)</button>
      <button id="export-pdf-btn" class="btn-secondary btn-block" style="margin-top: 0.5rem;">Exportar como PDF</button>

      <h4>Adicionar elemento</h4>
      <button class="add-element-btn" id="add-text-btn">+ Texto</button>
      <button class="add-element-btn" id="add-image-btn">+ Imagem</button>
      <input type="file" id="image-file-input" accept="image/*" hidden />
      <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem;">
        Ou arraste uma imagem direto pra dentro da página.
      </p>
    </aside>

    <div class="canvas-viewport">
      <div class="page-frame" id="page-frame">
        <span class="crop-tl"></span><span class="crop-tr"></span><span class="crop-bl"></span><span class="crop-br"></span>
        <div class="page-canvas" id="page-canvas"></div>
        <div class="page-spec" id="page-spec"></div>
      </div>
    </div>

    <aside class="editor-panel">
      <h4>Elemento selecionado</h4>
      <div id="element-props">
        <p style="color: var(--text-muted); font-size: 0.8rem;">Clique em um elemento no canvas para editar.</p>
      </div>
    </aside>
  </div>

  <div class="status-line" id="status-line">&nbsp;</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
