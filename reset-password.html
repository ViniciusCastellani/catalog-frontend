<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="auth-mark">catalog / editor</p>
      <h1>Redefinir senha</h1>
      <p class="auth-sub">Escolha sua nova senha. O link vale por 15 minutos.</p>

      <div id="msg"></div>

      <form id="reset-form">
        <div class="field">
          <label for="newPassword">Nova senha</label>
          <input type="password" id="newPassword" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmNewPassword">Confirmar nova senha</label>
          <input type="password" id="confirmNewPassword" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Redefinir senha</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
