<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="auth-mark">catalog / editor</p>
      <h1>Criar conta</h1>
      <p class="auth-sub">Leva menos de um minuto.</p>

      <div id="msg"></div>

      <form id="register-form">
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar senha</label>
          <input type="password" id="confirmPassword" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Criar conta</button>
      </form>

      <p class="auth-footer">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
