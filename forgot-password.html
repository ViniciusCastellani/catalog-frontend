<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="auth-mark">catalog / editor</p>
      <h1>Recuperar senha</h1>
      <p class="auth-sub">Digite o e-mail da sua conta.</p>

      <div id="msg"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Enviar instruções</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
