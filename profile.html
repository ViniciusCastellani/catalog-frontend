<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil · Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="brand">catalog<span>/</span>editor</a>
    <nav class="app-nav">
      <div class="user-badge">
        <img id="user-avatar" class="avatar" alt="" hidden />
        <span id="user-name"></span>
      </div>
      <a href="dashboard.html">Meus catálogos</a>
      <button id="logout-btn">Sair</button>
    </nav>
  </header>

  <main class="page-wrap" style="max-width: 480px;">
    <p class="eyebrow">Conta</p>
    <h1>Perfil</h1>

    <div id="profile-msg"></div>

    <form id="profile-form" style="margin-bottom: 2.5rem;">
      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" disabled />
      </div>
      <div class="field avatar-dropzone-wrap">
        <label>Foto de perfil</label>
        <div id="avatar-dropzone" class="avatar-dropzone" tabindex="0" role="button" aria-label="Escolher foto de perfil">
          <img id="avatar-preview" alt="" hidden />
          <span id="avatar-placeholder" class="avatar-placeholder">Arraste uma imagem<br />ou clique</span>
        </div>
        <input type="file" id="avatar-file-input" accept="image/*" hidden />
        <button type="button" id="avatar-remove-btn" class="avatar-remove-btn" hidden>Remover foto</button>
      </div>
      <button type="submit" class="btn-primary">Salvar perfil</button>
    </form>

    <h2 style="font-size: 1.1rem;">Trocar senha</h2>
    <div id="password-msg"></div>
    <form id="password-form" style="margin-bottom: 2.5rem;">
      <div class="field">
        <label for="currentPassword">Senha atual</label>
        <input type="password" id="currentPassword" required autocomplete="current-password" />
      </div>
      <div class="field">
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmNewPassword">Confirmar nova senha</label>
        <input type="password" id="confirmNewPassword" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary">Trocar senha</button>
    </form>

    <h2 style="font-size: 1.1rem; color: var(--danger);">Zona de risco</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted);">Excluir a conta desativa seu acesso. Não pode ser desfeito.</p>
    <button id="delete-account-btn" class="btn-danger">Excluir minha conta</button>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
